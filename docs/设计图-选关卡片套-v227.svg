<?xml version="1.0" encoding="UTF-8"?>
<!--
  选关屏 · 卡片套设计图（v227 定稿）
  ★ 坐标系 = 设计空间 1920×1080，**左上原点、Y 向下**（写代码用这个空间）
    依据：docs/控件坐标表-1600x900.md 表头「设计空间 1920 × 1080（左上原点、Y 向下，写代码用）」
  ★ 所有矩形 = lua/ui_controller.lua 的 build_layout 里 select 分支的 rect 原值
  ★ 生成：2026-10-15 · 构建标记 v227 · 交付档 359-选关四关一页-v227.gil
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1440" height="810"
     font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <style>
      .id   { font-size: 15px; fill: #7fd3ff; font-family: Consolas, monospace; }
      .rect { font-size: 13px; fill: #8a94a6; font-family: Consolas, monospace; }
      .lbl  { font-size: 26px; fill: #f2f4f8; }
      .note { font-size: 17px; fill: #ffd479; }
      .card { fill: #1d2432; stroke: #6b7a99; stroke-width: 2; }
      .strip{ fill: #2a3550; }
      .thumb{ fill: #10151f; stroke: #4a5878; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .btn  { fill: #232c40; stroke: #7f8fb0; stroke-width: 2; rx: 10; }
      .dim  { stroke: #55627d; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- 画布底 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#0b0e14"/>
  <text x="40" y="46" class="note">选关屏 · 卡片套设计图（设计空间 1920×1080，左上原点 Y 向下）· v227</text>

  <!-- ── select.title ── -->
  <rect x="460" y="80" width="1000" height="90" fill="none" stroke="#55627d" stroke-width="2" rx="8"/>
  <text x="960" y="140" class="lbl" text-anchor="middle">选择关卡</text>
  <text x="460" y="72" class="id">select.title</text>
  <text x="1470" y="100" class="rect">x=460 y=80 w=1000 h=90</text>

  <!-- ── 一行四张卡片 ── -->
  <!-- 卡片模板：x = 160 + (i-1)*420, y = 300, w = 380, h = 200 -->
  <g>
    <!-- 卡 1 -->
    <rect class="card" x="160" y="300" width="380" height="200" rx="10"/>
    <rect class="strip" x="176" y="310" width="348" height="34" rx="6"/>
    <text x="192" y="334" font-size="22" fill="#dbe4f5">案 001 · 五乘五</text>
    <rect class="thumb" x="176" y="356" width="348" height="96" rx="6"/>
    <text x="350" y="410" font-size="18" fill="#5f6c85" text-anchor="middle">棋盘缩略图</text>
    <text x="192" y="490" font-size="18" fill="#98a3b8">5×5　4名嫌疑人+1名受害人</text>
    <text x="160" y="292" class="id">select.card.1</text>
    <text x="192" y="524" class="id">.title</text>
    <text x="176" y="360" class="id" dx="-30" dy="-145">缩略图</text>
    <text x="192" y="524" class="id" dy="-172">.info</text>

    <!-- 卡 2 -->
    <rect class="card" x="580" y="300" width="380" height="200" rx="10"/>
    <rect class="strip" x="596" y="310" width="348" height="34" rx="6"/>
    <text x="612" y="334" font-size="22" fill="#dbe4f5">案 002 · 六乘六</text>
    <rect class="thumb" x="596" y="356" width="348" height="96" rx="6"/>
    <text x="770" y="410" font-size="18" fill="#5f6c85" text-anchor="middle">棋盘缩略图</text>
    <text x="612" y="490" font-size="18" fill="#98a3b8">6×6　5名嫌疑人+1名受害人</text>
    <text x="580" y="292" class="id">select.card.2</text>

    <!-- 卡 3 -->
    <rect class="card" x="1000" y="300" width="380" height="200" rx="10"/>
    <rect class="strip" x="1016" y="310" width="348" height="34" rx="6"/>
    <text x="1032" y="334" font-size="22" fill="#dbe4f5">案 003 · 六乘六</text>
    <rect class="thumb" x="1016" y="356" width="348" height="96" rx="6"/>
    <text x="1190" y="410" font-size="18" fill="#5f6c85" text-anchor="middle">棋盘缩略图</text>
    <text x="1032" y="490" font-size="18" fill="#98a3b8">6×6　5名嫌疑人+1名受害人</text>
    <text x="1000" y="292" class="id">select.card.3</text>

    <!-- 卡 4 -->
    <rect class="card" x="1420" y="300" width="380" height="200" rx="10"/>
    <rect class="strip" x="1436" y="310" width="348" height="34" rx="6"/>
    <text x="1452" y="334" font-size="22" fill="#dbe4f5">自测 · 盗窃五乘五</text>
    <rect class="thumb" x="1436" y="356" width="348" height="96" rx="6"/>
    <text x="1610" y="410" font-size="18" fill="#5f6c85" text-anchor="middle">棋盘缩略图</text>
    <text x="1452" y="490" font-size="18" fill="#98a3b8">5×5　4名嫌疑人+1名受害人</text>
    <text x="1420" y="292" class="id">select.card.4</text>
  </g>

  <!-- 卡片算式注释 -->
  <text x="160" y="560" class="rect">卡片算式：x = 160 + (i−1)×420　　y = 300（固定，不换行）　　w = 380　h = 200</text>
  <text x="160" y="586" class="rect">卡内：.title = 卡内 +16,+10　w−32 h34　｜　缩略图居中区　｜　.info = 卡内 +16, h−42　w−32 h32</text>
  <text x="160" y="612" class="note">★ 一页 4 张、一行四个；第 5 关起自动出第 2 页（PER = 4）</text>

  <!-- ── 底部一行：返回 / 上一页 / 页码 / 下一页 ── -->
  <rect x="0" y="930" width="1920" height="1" class="dim"/>

  <!-- select.back -->
  <rect class="btn" x="120" y="950" width="260" height="80"/>
  <text x="250" y="1000" class="lbl" text-anchor="middle">返回主页</text>
  <text x="120" y="942" class="id">select.back</text>
  <text x="120" y="1052" class="rect">x=120 y=950 w=260 h=80</text>

  <!-- select.prev -->
  <rect class="btn" x="700" y="950" width="220" height="80"/>
  <text x="810" y="1000" class="lbl" text-anchor="middle">上一页</text>
  <text x="700" y="942" class="id">select.prev</text>
  <text x="700" y="1052" class="rect">x=700 y=950 w=220 h=80</text>

  <!-- select.page -->
  <rect x="895" y="952" width="130" height="70" fill="none" stroke="#ffd479" stroke-width="2" rx="6"/>
  <text x="960" y="998" font-size="20" fill="#ffd479" text-anchor="middle">第1/2页</text>
  <text x="895" y="942" class="id">select.page</text>
  <text x="895" y="1052" class="rect">x=895 y=952 w=130 h=70</text>

  <!-- select.next -->
  <rect class="btn" x="1000" y="950" width="220" height="80"/>
  <text x="1110" y="1000" class="lbl" text-anchor="middle">下一页</text>
  <text x="1000" y="942" class="id">select.next</text>
  <text x="1000" y="1052" class="rect">x=1000 y=950 w=220 h=80</text>

  <!-- 显隐规则 -->
  <text x="1290" y="962" class="note">显隐规则（每帧按当前页重算）：</text>
  <text x="1290" y="990" class="rect">· 只有 1 页时 ⇒ 上一页 / 下一页 / 页码【整组隐藏】</text>
  <text x="1290" y="1014" class="rect">· 上一页：仅当 当前页 &gt; 1 时显示</text>
  <text x="1290" y="1038" class="rect">· 下一页：仅当 当前页 &lt; 总页数 时显示</text>

  <!-- 点击事件 -->
  <text x="160" y="700" class="note">点击事件：</text>
  <text x="160" y="728" class="rect">select.card.N  → action = pick_level, id = 该关 id　（整张卡片可点，含缩略图与文字）</text>
  <text x="160" y="754" class="rect">select.back    → action = home</text>
  <text x="160" y="780" class="rect">select.prev    → action = select_page, delta = −1　（页码夹紧到 [1, 总页数]）</text>
  <text x="160" y="806" class="rect">select.next    → action = select_page, delta = +1</text>
  <text x="160" y="832" class="note">★ 卡片状态（未开始 / 进行中 / ★ 已破案）＝ 空位预留，等奇匠等级 4 接上局内存档后再填</text>
</svg>
