ect x="539" y="777" width="58" height="48" rx="6" fill="#8599a1" stroke="#557181"/><text x="548" y="807" class="small">桌子</text><rect x="611" y="761" width="86" height="86" fill="#c0d5e3" stroke="#92adbd"/><rect x="625" y="777" width="58" height="48" rx="6" fill="#8599a1" stroke="#557181"/><text x="634" y="807" class="small">书架</text><path d="M267,503 h86" stroke="#19384f" stroke-width="7"/><path d="M353,503 h86" stroke="#19384f" stroke-width="7"/><path d="M439,503 h86" stroke="#19384f" stroke-width="7"/><path d="M525,503 h86" stroke="#19384f" stroke-width="7"/><path d="M611,503 h86" stroke="#19384f" stroke-width="7"/><path d="M95,589 h86" stroke="#19384f" stroke-width="7"/><path d="M181,589 h86" stroke="#19384f" stroke-width="7"/><path d="M439,245 v86" stroke="#19384f" stroke-width="7"/><path d="M439,331 v86" stroke="#19384f" stroke-width="7"/><path d="M439,417 v86" stroke="#19384f" stroke-width="7"/><path d="M267,503 v86" stroke="#19384f" stroke-width="7"/><path d="M267,589 v86" stroke="#19384f" stroke-width="7"/><path d="M267,675 v86" stroke="#19384f" stroke-width="7"/><path d="M267,761 v86" stroke="#19384f" stroke-width="7"/><path d="M292.8,503 h34.4" stroke="#c25e3f" stroke-width="10"/><path d="M464.8,503 h34.4" stroke="#c25e3f" stroke-width="10"/><path d="M120.8,589 h34.4" stroke="#c25e3f" stroke-width="10"/><path d="M439,442.8 v34.4" stroke="#c25e3f" stroke-width="10"/><path d="M267,786.8 v34.4" stroke="#c25e3f" stroke-width="10"/><rect x="95" y="245" width="602" height="602" fill="none" stroke="#19384f" stroke-width="8"/><text x="62" y="887" class="small">深蓝粗线＝墙　朱红短线＝门　椅子 / 地毯可站</text><text x="62" y="921" class="small">房间：左上大厅 · 右上侧廊 · 右下库房 · 左下内室</text><text x="770" y="164" class="sub">七卡候选方案 · 本人单句</text><text x="770" y="198" class="small">家具、墙门和预设位置保持；建议卡序 A B C D E F V。</text><rect x="758" y="225" width="780" height="80" rx="8" fill="#fffdf8"/><text x="778" y="254" class="body">A 何明</text><text x="965" y="254" class="body">我坐在椅子上。</text><text x="778" y="286" class="small">保留；候选 (3,2)、(5,4)</text><rect x="758" y="316" width="780" height="80" rx="8" fill="#fffdf8"/><text x="778" y="345" class="body">B 苏禾</text><text x="965" y="345" class="body">我在书架旁边。</text><text x="778" y="377" class="small">保留；候选 (1,5)、(2,6)、(6,7)</text><rect x="758" y="407" width="780" height="80" rx="8" fill="#fffdf8"/><text x="778" y="436" class="body">C 陈放</text><text x="965" y="436" class="body">我站在地毯上。</text><text x="778" y="468" class="small">保留；候选 (2,6)、(5,6)</text><rect x="758" y="498" width="780" height="80" rx="8" fill="#fffdf8"/><text x="778" y="527" class="body">D 林涛</text><text x="965" y="527" class="body">我在桌子旁边。</text><text x="778" y="559" class="small">保留；14 个初始候选，完整规则下仍需审慎</text><rect x="758" y="589" width="780" height="80" rx="8" fill="#fffdf8"/><text x="778" y="618" class="body">E 顾言</text><text x="965" y="618" class="body">我在雕塑旁边。</text><text x="778" y="650" class="small">只保留这一条；候选 (6,3)、(7,4)</text><rect x="758" y="680" width="780" height="80" rx="8" fill="#fffdf8"/><text x="778" y="709" class="body">F 周宁</text><text x="965" y="709" class="body">我在椅子旁边。</text><text x="778" y="741" class="small">保留；5 个初始候选</text><rect x="758" y="771" width="780" height="80" rx="8" fill="#deeff8"/><text x="778" y="800" class="body">V 吴老师</text><text x="965" y="800" class="body">我不在书架旁边。</text><text x="778" y="832" class="small">替代旧第7条；排除 (1,5)、(2,6)、(6,7)</text><text x="770" y="891" class="body">验证：全真摆位 4 → 2；每条在全真层均不可删除。</text><text x="770" y="924" class="small" style="fill:#ad412e">仍不是完整唯一解证明：身份与真假规则见网页说明。</text><path d="M62 962H1538" stroke="#92adbd"/><text x="62" y="1007" class="sub">E 的旧否定线索为什么无效</text><text x="62" y="1052" class="body">雕塑旁边：{ (6,3), (7,4) }</text><text x="62" y="1091" class="body">书架旁边：{ (1,5), (2,6), (6,7) }</text><text x="62" y="1130" class="body">两个集合没有交集。知道 E 在雕塑旁边，</text><text x="62" y="1165" class="body">就已经知道 E 不在书架旁边。第二条排除 0 格。</text><text x="62" y="1212" class="body" style="fill:#ad412e">删掉旧第7条：合法摆位仍为 4，解集逐项相同。</text><text x="822" y="1007" class="sub">验证边界与其他缺陷</text><text x="822" y="1052" class="small">① 其余六条也能固定 E=(7,4)；只换否定对象无效。</text><text x="822" y="1094" class="small">② hint_preview 第7条仍记录植物范围；运行时另行计算。</text><text x="822" y="1136" class="small">③ 教程“跨屋须有门”与家具旁边的同屋判定不一致。</text><text x="822" y="1178" class="small">④ 全真四解中的 B、D、V 均会移动，不能直接锁 B。</text><text x="822" y="1220" class="small">⑤ 固定 B 身份再验出一解，不等于从线索推出 B。</text><text x="62" y="1342" class="small">坐标均为（行，列），行向下、列向右。该图为关卡逻辑与布局设计图，不是游戏像素复刻。</text><text x="62" y="1379" class="small">读取基线：711_第六关线索去冗余修正.gil · 新建独立枚举；未采用旧求解过程与验收结论。</text></svg>